<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2140" viewBox="0 0 1200 2140" role="img" aria-labelledby="title desc">
  <title id="title">RDTC encoder-centric data contract</title>
  <desc id="desc">Range-Doppler-Beam samples from an FFT backend are flattened into 256 AXIS128 input beats, compressed by the hardware RDTC Encoder, carried as four header beats plus variable payload beats, and returned as bit-exact recovered I/Q by a PC/C decoder. A separate RTL decoder path closes verification; RDTC does not implement the upstream FFT.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <style>
      .title{font:700 48px Arial,sans-serif;fill:#0f172a}.sub{font:400 34px Arial,sans-serif;fill:#475569}.head{font:700 38px Arial,sans-serif;fill:#0f172a}.body{font:400 36px Arial,sans-serif;fill:#334155}.note{font:400 34px Arial,sans-serif;fill:#475569}.box{stroke:#334155;stroke-width:3}.flow{stroke:#334155;stroke-width:5;fill:none;marker-end:url(#arrow)}.verify{stroke:#7c3aed;stroke-width:4;stroke-dasharray:12 10;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="2140" fill="#f8fafc"/>
  <text x="55" y="62" class="title">RDTC encoder-centric data contract</text>
  <text x="55" y="108" class="sub">FFT backend output -&gt; hardware Encoder -&gt; packet transport</text>
  <text x="55" y="148" class="sub">-&gt; receiving-side recovery, with a separate RTL verification path</text>

  <rect x="90" y="190" width="1020" height="200" rx="6" class="box" fill="#dbeafe"/>
  <text x="135" y="242" class="head">FFT backend output</text>
  <text x="135" y="292" class="body">Range-Doppler-Beam tensor; signed I16Q16 samples</text>
  <text x="135" y="334" class="note">RDTC consumes this FFT-backend output.</text>
  <text x="135" y="376" class="note">RDTC does not implement FFT.</text>
  <path d="M600 390 V420" class="flow"/>

  <rect x="90" y="425" width="1020" height="170" rx="6" class="box" fill="#dcfce7"/>
  <text x="135" y="478" class="head">Block extraction / flattening</text>
  <text x="135" y="526" class="body">S[beam, doppler, range]; Range changes fastest</text>
  <text x="135" y="568" class="note">1 x 64 x 16 = 1024 complex samples = 4096 raw bytes</text>
  <path d="M600 595 V625" class="flow"/>

  <rect x="90" y="630" width="1020" height="200" rx="6" class="box" fill="#cffafe"/>
  <text x="135" y="683" class="head">AXIS128 input</text>
  <text x="135" y="731" class="body">256 accepted beats; 4 complex samples per beat</text>
  <text x="135" y="773" class="note">The final beat asserts TLAST at zero-based beat 255.</text>
  <text x="135" y="815" class="note">All 16 input bytes are valid.</text>
  <path d="M600 830 V860" class="flow"/>

  <rect x="90" y="865" width="1020" height="170" rx="6" class="box" fill="#fef3c7"/>
  <text x="135" y="920" class="head">Hardware RDTC Encoder</text>
  <text x="135" y="968" class="body">RAW / ZERO / DELTA</text>
  <text x="135" y="1010" class="note">predict -&gt; adaptive k -&gt; lane pack -&gt; packet framing</text>
  <path d="M600 1035 V1065" class="flow"/>

  <rect x="90" y="1070" width="1020" height="200" rx="6" class="box" fill="#ede9fe"/>
  <text x="135" y="1125" class="head">Compressed packet</text>
  <text x="135" y="1173" class="body">4 header beats + variable payload beats</text>
  <text x="135" y="1215" class="note">TLAST marks packet end.</text>
  <text x="135" y="1257" class="note">TUSER[3:0] = final valid-byte count - 1.</text>
  <path d="M600 1270 V1300" class="flow"/>

  <rect x="90" y="1305" width="1020" height="190" rx="6" class="box" fill="#fff7ed"/>
  <text x="135" y="1360" class="head">Store / transport</text>
  <text x="135" y="1408" class="body">DDR / interconnect / Ethernet / PC upload</text>
  <text x="135" y="1450" class="note">Packet boundary and tail-byte count remain part</text>
  <text x="135" y="1482" class="note">of the stream contract.</text>
  <path d="M340 1495 V1530" class="flow"/>
  <path d="M1030 1270 V1515 H860 V1530" class="verify"/>

  <rect x="90" y="1535" width="500" height="245" rx="6" class="box" fill="#fee2e2"/>
  <text x="340" y="1590" text-anchor="middle" class="head">PC/C decoder</text>
  <text x="340" y="1640" text-anchor="middle" class="body">receiving-side recovery</text>
  <text x="340" y="1688" text-anchor="middle" class="note">conventional self-describing</text>
  <text x="340" y="1730" text-anchor="middle" class="note">header-length packets</text>

  <rect x="610" y="1535" width="500" height="245" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="860" y="1590" text-anchor="middle" class="head">RTL decoder</text>
  <text x="860" y="1634" text-anchor="middle" class="head">verification path</text>
  <text x="860" y="1684" text-anchor="middle" class="body">protocol closure + loopback</text>
  <text x="860" y="1730" text-anchor="middle" class="note">malformed checks</text>
  <text x="860" y="1768" text-anchor="middle" class="note">+ hardware reference</text>

  <path d="M340 1780 V1815" class="flow"/>
  <rect x="90" y="1820" width="500" height="200" rx="6" class="box" fill="#dbeafe"/>
  <text x="340" y="1885" text-anchor="middle" class="head">bit-exact recovered I/Q</text>
  <text x="340" y="1940" text-anchor="middle" class="body">1024 original samples</text>

  <rect x="610" y="1820" width="500" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="860" y="1885" text-anchor="middle" class="head">Role boundary</text>
  <text x="860" y="1935" text-anchor="middle" class="body">Encoder-centric hardware</text>
  <text x="860" y="1977" text-anchor="middle" class="note">production ASIC need not</text>
  <text x="860" y="2004" text-anchor="middle" class="note">instantiate the RTL decoder.</text>
</svg>
