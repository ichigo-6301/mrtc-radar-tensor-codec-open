<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc">
  <title id="title">Direct wrapper stream trace: Engine 0 / Block 0</title>
  <desc id="desc">Fixed ModelSim functional trace from the final two-Engine Direct wrapper. The diagram derives input, prefix, ring, output, and deterministic backpressure events from public nominal and backpressure CSV files.</desc>
  <style>.title{font:700 36px Arial,sans-serif;fill:#0f172a}.sub{font:400 25px Arial,sans-serif;fill:#475569}.lane{font:700 26px Arial,sans-serif;fill:#0f172a}.note{font:400 24px Arial,sans-serif;fill:#334155}.tiny{font:400 22px Arial,sans-serif;fill:#475569}.hash{font:400 24px 'Courier New',monospace;fill:#475569}.inside{font:700 20px Arial,sans-serif;fill:#0f172a}.axis{stroke:#64748b;stroke-width:2}.marker{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 6}.input{fill:#bfdbfe;stroke:#2563eb;stroke-width:1}.prefix{fill:#dbeafe;stroke:#2563eb;stroke-width:1}.write{fill:#dcfce7;stroke:#16a34a;stroke-width:1}.request{fill:#fef3c7;stroke:#d97706;stroke-width:1}.response{fill:#ffedd5;stroke:#ea580c;stroke-width:1}.header{fill:#ddd6fe;stroke:#7c3aed;stroke-width:1}.payload{fill:#cffafe;stroke:#0891b2;stroke-width:1}.hold{fill:#fecaca;stroke:#dc2626;stroke-width:1}.accepted{fill:#bbf7d0;stroke:#16a34a;stroke-width:1}.panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}</style>
  <rect width="1000" height="810" fill="#f8fafc"/>
  <text x="42" y="45" class="title">Direct wrapper stream trace: Engine 0 / Block 0</text>
  <text x="42" y="73" class="sub">Fixed ModelSim functional trace, 2-Engine / 2-block register-expanded Direct wrapper</text>
  <text x="42" y="98" class="sub">Cycle positions audit protocol ordering only; not a frequency, throughput, or duty claim.</text>
<line x1="194.00" y1="120" x2="194.00" y2="490" class="marker"/><text x="194.00" y="112" class="tiny" text-anchor="middle">c6</text><line x1="269.60" y1="120" x2="269.60" y2="490" class="marker"/><text x="269.60" y="112" class="tiny" text-anchor="middle">c38</text><line x1="312.12" y1="120" x2="312.12" y2="490" class="marker"/><text x="312.12" y="112" class="tiny" text-anchor="middle">c56</text><line x1="919.29" y1="120" x2="919.29" y2="490" class="marker"/><text x="919.29" y="112" class="tiny" text-anchor="middle">c313</text><line x1="950.00" y1="120" x2="950.00" y2="490" class="marker"/><text x="950.00" y="112" class="tiny" text-anchor="middle">c326</text>
  <text x="42" y="166" class="lane">input fire</text><rect x="194.00" y="144" width="75.60" height="34" class="prefix"/><text x="231.80" y="167.0" text-anchor="middle" class="inside">first 32</text><rect x="269.60" y="144" width="529.20" height="34" class="input"/><text x="534.20" y="167.0" text-anchor="middle" class="inside">remaining 224</text><text x="490.00" y="190" class="tiny">256 accepted AXIS128 beats</text><text x="730.00" y="190" class="tiny">prefix-128 = first 32 beats</text>
  <text x="42" y="206" class="lane">prefix / k</text><line x1="290.86" y1="184" x2="290.86" y2="229" stroke="#7c3aed" stroke-width="4"/><text x="298.86" y="205" class="tiny">prefix-128 done</text><line x1="293.23" y1="184" x2="293.23" y2="229" stroke="#be123c" stroke-width="4"/><text x="301.23" y="225" class="tiny">selected k valid</text>
  <text x="42" y="264" class="lane">ring write</text><rect x="194.00" y="244" width="604.80" height="28" class="write"/>
  <text x="42" y="304" class="lane">ring read req</text><rect x="312.12" y="284" width="604.80" height="28" class="request"/><text x="312.12" y="276" class="tiny">continuous addresses 0..255; II=1</text>
  <text x="42" y="360" class="lane">ring read rsp</text><rect x="316.85" y="340" width="604.80" height="28" class="response"/><text x="799.29" y="390" class="tiny">response +2 cycles</text>
  <line x1="194" y1="405" x2="950" y2="405" class="axis"/>
  <text x="42" y="448" class="lane">m_axis TVALID</text><rect x="297.95" y="426" width="94" height="34" class="header"/><line x1="321.45" y1="426" x2="321.45" y2="460" stroke="#7c3aed" stroke-width="1"/><line x1="344.95" y1="426" x2="344.95" y2="460" stroke="#7c3aed" stroke-width="1"/><line x1="368.45" y1="426" x2="368.45" y2="460" stroke="#7c3aed" stroke-width="1"/><text x="344.95" y="449" text-anchor="middle" class="inside">H0 H1 H2 H3</text><rect x="383.00" y="426" width="2.36" height="34" class="payload"/><rect x="420.80" y="426" width="2.36" height="34" class="payload"/><rect x="458.60" y="426" width="2.36" height="34" class="payload"/><rect x="496.40" y="426" width="2.36" height="34" class="payload"/><rect x="534.20" y="426" width="2.36" height="34" class="payload"/><rect x="572.00" y="426" width="2.36" height="34" class="payload"/><rect x="609.80" y="426" width="2.36" height="34" class="payload"/><rect x="647.60" y="426" width="2.36" height="34" class="payload"/><rect x="685.40" y="426" width="2.36" height="34" class="payload"/><rect x="723.20" y="426" width="2.36" height="34" class="payload"/><rect x="761.00" y="426" width="2.36" height="34" class="payload"/><rect x="798.80" y="426" width="2.36" height="34" class="payload"/><rect x="836.60" y="426" width="2.36" height="34" class="payload"/><rect x="874.40" y="426" width="2.36" height="34" class="payload"/><rect x="912.20" y="426" width="2.36" height="34" class="payload"/><rect x="950.00" y="426" width="2.36" height="34" class="payload"/><text x="951.18" y="449.0" text-anchor="middle" class="inside">TLAST</text>
  <text x="297.95" y="482" class="tiny">4 accepted header beats</text><text x="383.00" y="482" class="tiny">payload TVALID bubbles</text>
  <text x="42" y="562" class="lane">backpressure</text><rect x="214" y="540" width="632" height="34" class="panel"/><rect x="236" y="540" width="58" height="34" class="accepted"/><rect x="294" y="540" width="116" height="34" class="hold"/><rect x="410" y="540" width="58" height="34" class="accepted"/><text x="352" y="562" text-anchor="middle" class="inside">H1 held</text><rect x="590" y="540" width="58" height="34" class="accepted"/><rect x="648" y="540" width="116" height="34" class="hold"/><rect x="764" y="540" width="58" height="34" class="accepted"/><text x="706" y="562" text-anchor="middle" class="inside">P0 held</text>
  <text x="352" y="613" class="tiny" text-anchor="middle">header hold: 2 cycles (c51-c52)</text><text x="706" y="613" class="tiny" text-anchor="middle">payload hold: 2 cycles (c86-c87)</text>
  <rect x="42" y="651" width="916" height="136" rx="5" class="panel"/>
  <text x="58" y="680" class="note">TVALID &amp;&amp; !TREADY holds TDATA / TUSER / TLAST stable; red cells are deterministic two-cycle holds.</text>
  <text x="58" y="710" class="tiny">nominal CSV SHA256</text><text x="58" y="738" class="hash">321b6f06d028183d4a0f776d87156d2a</text><text x="58" y="764" class="hash">1bf9693b38c375330a53428d41785392</text>
  <text x="520" y="710" class="tiny">backpressure CSV SHA256</text><text x="520" y="738" class="hash">4ba2fc62ff54134081c0875187ebe4a3</text><text x="520" y="764" class="hash">382b585004c69ccbea059bde1d79aa1d</text>
</svg>
