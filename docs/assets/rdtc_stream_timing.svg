<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="title desc">
  <title id="title">Direct wrapper stream trace: Engine 0 / Block 0</title>
  <desc id="desc">Fixed ModelSim functional trace from the final two-Engine Direct wrapper. The diagram derives input, prefix, ring, output, and deterministic backpressure events from public nominal and backpressure CSV files.</desc>
  <style>.title{font:700 36px Arial,sans-serif;fill:#0f172a}.sub{font:400 28px Arial,sans-serif;fill:#475569}.lane{font:700 29px Arial,sans-serif;fill:#0f172a}.note{font:400 28px Arial,sans-serif;fill:#334155}.tiny{font:400 28px Arial,sans-serif;fill:#475569}.hash{font:400 28px 'Courier New',monospace;fill:#475569}.inside{font:700 28px Arial,sans-serif;fill:#0f172a}.axis{stroke:#64748b;stroke-width:2}.marker{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 6}.input{fill:#bfdbfe;stroke:#2563eb;stroke-width:1}.prefix{fill:#dbeafe;stroke:#2563eb;stroke-width:1}.write{fill:#dcfce7;stroke:#16a34a;stroke-width:1}.request{fill:#fef3c7;stroke:#d97706;stroke-width:1}.response{fill:#ffedd5;stroke:#ea580c;stroke-width:1}.header{fill:#ddd6fe;stroke:#7c3aed;stroke-width:1}.payload{fill:#cffafe;stroke:#0891b2;stroke-width:1}.hold{fill:#fecaca;stroke:#dc2626;stroke-width:1}.accepted{fill:#bbf7d0;stroke:#16a34a;stroke-width:1}.panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}</style>
  <rect width="1000" height="1020" fill="#f8fafc"/>
  <text x="42" y="45" class="title">Direct wrapper stream trace: Engine 0 / Block 0</text>
  <text x="42" y="80" class="sub">Fixed ModelSim functional trace: 2-Engine / 2-block Direct wrapper</text>
  <text x="42" y="112" class="sub">Register-expanded profile; not a frequency, throughput, or duty claim.</text>
<line x1="194.00" y1="140" x2="194.00" y2="590" class="marker"/><text x="194.00" y="132" class="tiny" text-anchor="middle">c6</text><line x1="269.60" y1="140" x2="269.60" y2="590" class="marker"/><text x="251.60" y="132" class="tiny" text-anchor="middle">c38</text><line x1="312.12" y1="140" x2="312.12" y2="590" class="marker"/><text x="330.12" y="132" class="tiny" text-anchor="middle">c56</text><line x1="950.00" y1="140" x2="950.00" y2="590" class="marker"/><text x="950.00" y="132" class="tiny" text-anchor="middle">c326</text>
  <text x="42" y="180" class="lane">input fire</text><rect x="194.00" y="155" width="75.60" height="34" class="prefix"/><rect x="269.60" y="155" width="529.20" height="34" class="input"/><text x="204" y="217" class="tiny">prefix-128 = first 32 beats</text><text x="590" y="217" class="tiny">256 accepted AXIS128 beats</text>
  <text x="42" y="260" class="lane">prefix / k</text><line x1="290.86" y1="225" x2="290.86" y2="275" stroke="#7c3aed" stroke-width="4"/><text x="298.86" y="245" class="tiny">prefix done</text><line x1="293.23" y1="225" x2="293.23" y2="275" stroke="#be123c" stroke-width="4"/><text x="301.23" y="275" class="tiny">selected k valid</text>
  <text x="42" y="320" class="lane">ring write</text><rect x="194.00" y="300" width="604.80" height="28" class="write"/>
  <text x="42" y="370" class="lane">ring read req</text><rect x="312.12" y="350" width="604.80" height="28" class="request"/><text x="312.12" y="342" class="tiny">continuous addresses 0..255; II=1</text>
  <text x="42" y="425" class="lane">ring read rsp</text><rect x="316.85" y="405" width="604.80" height="28" class="response"/><text x="950" y="468" class="tiny" text-anchor="end">fixed response +2 cycles</text>
  <line x1="194" y1="485" x2="950" y2="485" class="axis"/>
  <text x="42" y="530" class="lane">m_axis TVALID</text><rect x="297.95" y="508" width="2.36" height="34" class="header"/><rect x="300.31" y="508" width="2.36" height="34" class="header"/><rect x="302.68" y="508" width="2.36" height="34" class="header"/><rect x="305.04" y="508" width="2.36" height="34" class="header"/><rect x="383.00" y="508" width="2.36" height="34" class="payload"/><rect x="420.80" y="508" width="2.36" height="34" class="payload"/><rect x="458.60" y="508" width="2.36" height="34" class="payload"/><rect x="496.40" y="508" width="2.36" height="34" class="payload"/><rect x="534.20" y="508" width="2.36" height="34" class="payload"/><rect x="572.00" y="508" width="2.36" height="34" class="payload"/><rect x="609.80" y="508" width="2.36" height="34" class="payload"/><rect x="647.60" y="508" width="2.36" height="34" class="payload"/><rect x="685.40" y="508" width="2.36" height="34" class="payload"/><rect x="723.20" y="508" width="2.36" height="34" class="payload"/><rect x="761.00" y="508" width="2.36" height="34" class="payload"/><rect x="798.80" y="508" width="2.36" height="34" class="payload"/><rect x="836.60" y="508" width="2.36" height="34" class="payload"/><rect x="874.40" y="508" width="2.36" height="34" class="payload"/><rect x="912.20" y="508" width="2.36" height="34" class="payload"/><rect x="950.00" y="508" width="2.36" height="34" class="payload"/>
  <text x="300" y="578" class="tiny" text-anchor="middle">4 accepted header beats</text><text x="705" y="578" class="tiny" text-anchor="middle">payload TVALID bubbles</text>
  <rect x="244" y="608" width="602" height="34" class="panel"/><text x="42" y="630" class="lane">backpressure</text><rect x="252" y="608" width="58" height="34" class="accepted"/><rect x="310" y="608" width="116" height="34" class="hold"/><rect x="426" y="608" width="58" height="34" class="accepted"/><text x="368" y="634" text-anchor="middle" class="inside">H1 hold</text><rect x="606" y="608" width="58" height="34" class="accepted"/><rect x="664" y="608" width="116" height="34" class="hold"/><rect x="780" y="608" width="58" height="34" class="accepted"/><text x="722" y="634" text-anchor="middle" class="inside">P0 hold</text>
  <text x="368" y="684" class="tiny" text-anchor="middle">header hold: 2 cycles</text><text x="722" y="684" class="tiny" text-anchor="middle">payload hold: 2 cycles</text>
  <rect x="42" y="720" width="916" height="285" rx="5" class="panel"/>
  <text x="58" y="752" class="note">TVALID &amp;&amp; !TREADY holds TDATA / TUSER / TLAST stable.</text>
  <text x="58" y="784" class="note">Red cells are deterministic two-cycle holds.</text>
  <text x="58" y="824" class="tiny">nominal CSV SHA256</text>
  <text x="58" y="856" class="hash">321b6f06d028183d4a0f776d87156d2a</text><text x="58" y="888" class="hash">1bf9693b38c375330a53428d41785392</text>
  <text x="58" y="928" class="tiny">backpressure CSV SHA256</text>
  <text x="58" y="960" class="hash">4ba2fc62ff54134081c0875187ebe4a3</text><text x="58" y="992" class="hash">382b585004c69ccbea059bde1d79aa1d</text>
