<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">MRTC-RDTC: sensing tensor to bit-exact reconstruction</title>
  <desc id="desc">An end-to-end technical overview of the fixed radar-tensor block contract, configurable lossless RDTC coding, scalable engines, packet-atomic AXI output, and bit-exact reconstruction.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .title{font:700 38px Arial,Helvetica,sans-serif;fill:#111827}
    .subtitle{font:400 22px Arial,Helvetica,sans-serif;fill:#4b5563}
    .panel-title{font:700 25px Arial,Helvetica,sans-serif;fill:#102f5e}
    .section{font:700 22px Arial,Helvetica,sans-serif;fill:#111827}
    .body{font:400 19px Arial,Helvetica,sans-serif;fill:#1f2937}
    .body-bold{font:700 19px Arial,Helvetica,sans-serif;fill:#111827}
    .metric{font:700 23px Arial,Helvetica,sans-serif;fill:#0f4c9a}
    .small{font:400 16px Arial,Helvetica,sans-serif;fill:#4b5563}
    .foot{font:400 17px Arial,Helvetica,sans-serif;fill:#374151}
    .table-head{font:700 17px Arial,Helvetica,sans-serif;fill:#ffffff}
    .rule{stroke:#102f5e;stroke-width:1.5}
    .thin{stroke:#9ca3af;stroke-width:1}
    .box{fill:#ffffff;stroke:#6b7280;stroke-width:1.2}
    .box-blue{fill:#ffffff;stroke:#1456a0;stroke-width:1.4}
    .flow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="48" y="58" class="title">MRTC-RDTC: sensing tensor to bit-exact reconstruction</text>
  <text x="48" y="92" class="subtitle">Fixed block semantics, configurable lossless coding, packet-atomic streaming, and evidence-backed implementation profiles</text>
  <line x1="48" y1="116" x2="1552" y2="116" class="rule"/>

  <text x="48" y="162" class="panel-title">End-to-End Data Path</text>

  <rect x="48" y="190" width="245" height="410" class="box"/>
  <rect x="48" y="190" width="245" height="52" fill="#102f5e"/>
  <text x="170" y="224" text-anchor="middle" class="table-head">Sensing Block</text>
  <text x="170" y="282" text-anchor="middle" class="section">OFDM sensing</text>
  <g stroke="#6b7280" stroke-width="1" fill="#ffffff">
    <rect x="103" y="315" width="134" height="112"/>
    <path d="M130 315 V427 M157 315 V427 M184 315 V427 M211 315 V427"/>
    <path d="M103 337 H237 M103 359 H237 M103 382 H237 M103 404 H237"/>
  </g>
  <rect x="157" y="337" width="27" height="22" fill="#1456a0"/>
  <rect x="211" y="382" width="26" height="22" fill="#8b9199"/>
  <text x="170" y="471" text-anchor="middle" class="body-bold">1024 samples / block</text>
  <text x="170" y="505" text-anchor="middle" class="body">complex I16Q16</text>
  <text x="170" y="539" text-anchor="middle" class="metric">4096 raw bytes</text>
  <text x="170" y="572" text-anchor="middle" class="small">ADC / FFT pipeline boundary</text>

  <line x1="293" y1="395" x2="330" y2="395" class="flow"/>

  <rect x="340" y="190" width="260" height="410" class="box-blue"/>
  <rect x="340" y="190" width="260" height="52" fill="#102f5e"/>
  <text x="470" y="224" text-anchor="middle" class="table-head">Lossless RDTC</text>
  <text x="470" y="282" text-anchor="middle" class="section">Mode selection</text>
  <rect x="385" y="315" width="170" height="52" class="box"/>
  <text x="470" y="348" text-anchor="middle" class="body-bold">RAW_BYPASS</text>
  <rect x="385" y="383" width="170" height="52" class="box-blue"/>
  <text x="470" y="416" text-anchor="middle" class="body-bold">ZERO_RICE</text>
  <rect x="385" y="451" width="170" height="52" class="box-blue"/>
  <text x="470" y="484" text-anchor="middle" class="body-bold">DELTA_RICE</text>
  <text x="470" y="543" text-anchor="middle" class="small">predict / map / k-select / pack</text>
  <text x="470" y="572" text-anchor="middle" class="body">64-byte header + payload</text>

  <line x1="600" y1="395" x2="637" y2="395" class="flow"/>

  <rect x="647" y="190" width="300" height="410" class="box-blue"/>
  <rect x="647" y="190" width="300" height="52" fill="#102f5e"/>
  <text x="797" y="224" text-anchor="middle" class="table-head">N x independent Engine</text>
  <text x="797" y="282" text-anchor="middle" class="section">Whole-block ownership</text>
  <rect x="697" y="320" width="200" height="64" class="box-blue"/>
  <text x="797" y="360" text-anchor="middle" class="body-bold">Engine 0</text>
  <rect x="697" y="404" width="200" height="64" class="box-blue"/>
  <text x="797" y="444" text-anchor="middle" class="body-bold">Engine 1</text>
  <text x="797" y="510" text-anchor="middle" class="body">Round-robin block dispatch</text>
  <text x="797" y="543" text-anchor="middle" class="small">Buffered and Direct-AXIS profiles</text>
  <text x="797" y="572" text-anchor="middle" class="small">use different storage boundaries</text>

  <line x1="947" y1="395" x2="984" y2="395" class="flow"/>

  <rect x="994" y="190" width="270" height="410" class="box"/>
  <rect x="994" y="190" width="270" height="52" fill="#102f5e"/>
  <text x="1129" y="224" text-anchor="middle" class="table-head">Packet-locked AXI</text>
  <text x="1129" y="282" text-anchor="middle" class="section">Packet identity</text>
  <rect x="1044" y="320" width="170" height="76" class="box-blue"/>
  <text x="1129" y="351" text-anchor="middle" class="body-bold">Header</text>
  <text x="1129" y="378" text-anchor="middle" class="small">Frame / Block ID</text>
  <rect x="1044" y="418" width="170" height="76" class="box"/>
  <text x="1129" y="463" text-anchor="middle" class="body-bold">Payload</text>
  <text x="1129" y="539" text-anchor="middle" class="body">No beat interleaving</text>
  <text x="1129" y="572" text-anchor="middle" class="small">TLAST / TUSER preserved</text>

  <line x1="1264" y1="395" x2="1301" y2="395" class="flow"/>

  <rect x="1311" y="190" width="241" height="410" class="box"/>
  <rect x="1311" y="190" width="241" height="52" fill="#102f5e"/>
  <text x="1431" y="224" text-anchor="middle" class="table-head">Bit-Exact Decoder</text>
  <text x="1431" y="282" text-anchor="middle" class="section">Reconstruction</text>
  <rect x="1361" y="320" width="141" height="64" class="box"/>
  <text x="1431" y="360" text-anchor="middle" class="body-bold">Parse</text>
  <line x1="1431" y1="384" x2="1431" y2="409" class="flow"/>
  <rect x="1361" y="419" width="141" height="64" class="box-blue"/>
  <text x="1431" y="459" text-anchor="middle" class="body-bold">Restore</text>
  <text x="1431" y="526" text-anchor="middle" class="metric">I/Q bit-exact</text>
  <text x="1431" y="562" text-anchor="middle" class="small">finite verified vectors</text>

  <rect x="48" y="650" width="1504" height="220" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <rect x="48" y="650" width="1504" height="52" fill="#102f5e"/>
  <text x="800" y="684" text-anchor="middle" class="table-head">End-to-End Contract and Maturity Boundary</text>
  <line x1="550" y1="702" x2="550" y2="870" class="thin"/>
  <line x1="1050" y1="702" x2="1050" y2="870" class="thin"/>

  <text x="82" y="747" class="panel-title">Block semantics</text>
  <text x="82" y="790" class="body">Explicit mode, payload length, and selected k</text>
  <text x="82" y="826" class="body">Frame / Block metadata preserves identity</text>

  <text x="584" y="747" class="panel-title">Stream semantics</text>
  <text x="584" y="790" class="body">Backpressure-safe packet framing</text>
  <text x="584" y="826" class="body">Packet atomicity; completion order may vary</text>

  <text x="1084" y="747" class="panel-title">Verification boundary</text>
  <text x="1084" y="790" class="body">Finite-vector MATLAB / C / RTL agreement</text>
  <text x="1084" y="826" class="body">No software reorder PASS claimed</text>

  <line x1="48" y1="908" x2="1552" y2="908" class="thin"/>
  <text x="48" y="944" class="foot">Architecture overview only; performance, PPA, and power claims are reported in separate controlled A/B figures below.</text>
  <text x="48" y="974" class="foot">Implementation points are profile-specific fixed results, not Fmax, board-throughput, foundry-signoff, or silicon claims.</text>
</svg>
