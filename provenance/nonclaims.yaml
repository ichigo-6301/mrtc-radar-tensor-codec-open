kind: nonclaims
schema_version: 1.0.0
nonclaims:
  - id: rdtc_v1_no_pointcloud_or_rle_rtl
    profile: rdtc_v1_public_release
    statement: "RDTC v1 does not claim PointCloud RTL, RLE_RICE RTL, AXI-MM or DMA-descriptor integration."
    reason: These functions are outside the published RDTC v1 lossless codec scope.
    status: not_claimed
    public: true
  - id: rdtc_v1_no_asic_signoff
    profile: rdtc_v1_public_release
    statement: "RDTC v1 does not claim IO timing closure, OCV/MMMC closure, foundry signoff, macro DRC/LVS/PEX, DFT/ATPG, LEC, GLS/SDF, or silicon readiness."
    reason: "The public implementation evidence is academic internal reg-to-reg timing with explicit PDK, RC, memory-model, and integration-boundary caveats."
    status: not_claimed
    public: true
  - id: rdtc_v1_no_board_pass
    profile: rdtc_v1_public_release
    statement: RDTC v1 does not claim a board PASS result.
    reason: No public hardware console log with a defined PASS marker is registered for this release.
    status: not_claimed
    public: true
  - id: rdtc_v1_no_dual_input_fpga_or_bitstream
    profile: rdtc_v1_public_release
    statement: "The historical AXIS32 profile does not claim direct Vivado 2018.3 elaboration of the current public RTL, concurrent dual-input FPGA verification, timing/resource closure, a generated bitstream, MCDMA/DDR runtime behavior, or measured FPGA performance."
    reason: "The historical FPGA-emulation evidence is a single-active-input AXIS32 Vivado simulation. The separate bounded Direct-AXIS profile has its own Vivado 2022.2 OOC timing/resource evidence, but still makes no bitstream or board claim."
    status: not_claimed
    public: true
  - id: rdtc_v1_no_software_reorder_pass
    profile: rdtc_v1_public_release
    statement: RDTC v1 does not claim a completed or validated software packet-reorder implementation.
    reason: Frame/block metadata and packet identity support indexed reassembly, while the published RTL evidence validates packet atomicity and integrity only.
    status: not_claimed
    public: true
  - id: rdtc_v1_bounded_direct_no_sustained_zero_stall
    profile: rdtc_v1_bounded_direct_axis
    statement: "The bounded Direct-AXIS profile does not claim sustained zero-stall operation for continuously arriving 256-cycle blocks."
    reason: "The recorded strict-order packet service is approximately 277 cycles, so the 21-cycle deficit accumulates and eventually causes a legal way conflict in a finite four-way ring."
    status: not_claimed
    public: true
  - id: rdtc_v1_bounded_direct_no_atomic_error_rollback
    profile: rdtc_v1_bounded_direct_axis
    statement: "The bounded Direct-AXIS profile does not claim atomic rollback after output-credit exhaustion or another scoped fatal error."
    reason: "The direct path intentionally removes payload commit storage; a fatal event can leave a partial packet externally visible, and recovery requires resetting both producer and receiver state."
    status: not_claimed
    public: true
  - id: rdtc_v1_bounded_direct_no_sram600
    profile: rdtc_v1_bounded_direct_sram_macro
    statement: "The bounded Direct-AXIS SRAM profile does not claim a 600 MHz macro-backed implementation point."
    reason: "The characterized WPR2 and WPR1 macro candidates fail the 1.666667 ns period and 0.833333 ns pulse-width gates, while WPR4 is unsupported by the pinned OpenRAM generator."
    status: blocked
    public: true
  - id: rdtc_v1_bounded_dc_ab_no_physical_ppa
    profile: rdtc_v1_bounded_architecture_dc_ab
    statement: "The bounded buffered-versus-Direct 315 MHz area comparison does not claim SRAM-macro area, post-route area, power, Fmax, or foundry signoff."
    reason: "The paired result expands both architectures into standard cells and stops after Design Compiler under a common synchronous-boundary SDC."
    status: not_claimed
    public: true
  - id: rdtc_v1_bitpacker_ab_no_system_speedup
    profile: rdtc_v1_historical_lane4_bitpacker
    statement: "The historical 10.6699x Bitpacker result is not a whole-block, Multi-Engine, Direct-AXIS sustained-throughput, FPGA-performance, ASIC-frequency, or Fmax claim."
    reason: "It measures only the inclusive interval from first payload valid to accepted packet TLAST on one fixed smoke_zero_sparse RTL workload."
    status: not_claimed
    public: true
  - id: rdtc_v1_single_engine_interval_no_latency_or_direct
    profile: rdtc_v1_historical_lane4_bitpacker
    statement: "The historical 8220-to-785 cycles/block result is not one-block latency, current Direct-AXIS sustained throughput, FPGA timing, ASIC frequency, or Fmax."
    reason: "It is the average packet-completion spacing over fixed 256-block single-Engine streams; both A/B points already retain prefix-during-capture."
    status: not_claimed
    public: true
  - id: rdtc_v1_direct_stream_timing_no_performance_generalization
    profile: rdtc_v1_bounded_direct_axis
    statement: "The fixed Direct-wrapper stream trace does not claim universal block latency or TVALID duty, isolated single-Engine system throughput, Multi-Engine scaling, sustained zero-gap operation, FPGA/ASIC timing, or Fmax."
    reason: "It is a finite two-block functional protocol regression with deterministic short backpressure; absolute simulation cycles only make event ordering auditable."
    status: not_claimed
    public: true
  - id: rdtc_v1_power_architecture_ab_no_postroute_or_clocktree
    profile: rdtc_v1_bounded_architecture_power_ab
    statement: "The 315 MHz architecture-power A/B does not claim post-route or PrimeTime-PX power, CTS clock-tree power, silicon-measured or foundry-signoff power, Fmax, or a universal saving across untested workloads."
    reason: "Each point is an activity-driven Design Compiler mapped-netlist estimate from its own RTL SAIF; no routed parasitics or implemented clock tree were analyzed."
    status: not_claimed
    public: true
